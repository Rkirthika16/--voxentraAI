services:
  # FastAPI Backend Service
  - type: web
    name: voxentra-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./voxentra.db
      - key: BACKEND_CORS_ORIGINS
        value: "*"

  # React Frontend Static Site
  - type: web
    name: voxentra-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: voxentra-backend
          property: host
